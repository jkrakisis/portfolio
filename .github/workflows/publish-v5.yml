name: Publish portfolio v5

on:
  push:
    branches: [portfolio-v5-preview]
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: publish-portfolio-v5
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/portfolio-v5-preview'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out v5 source
        uses: actions/checkout@v4
        with:
          ref: portfolio-v5-preview
          path: source
          persist-credentials: false
      - name: Check out production branch
        uses: actions/checkout@v4
        with:
          ref: main
          path: production
      - name: Prepare isolated v5 directory
        shell: python
        run: |
          import json, pathlib, shutil, subprocess
          from html.parser import HTMLParser
          from urllib.parse import urlsplit, unquote
          source = pathlib.Path('source').resolve()
          production = pathlib.Path('production').resolve()
          target = production / 'v5'
          assert target.resolve().parent == production
          html = (source / 'preview-v5.html').read_bytes()
          resources = set()
          class Resources(HTMLParser):
              def handle_starttag(self, tag, attrs):
                  attrs = dict(attrs)
                  if tag in ('img', 'script', 'link', 'source'):
                      for key in ('src', 'href'):
                          value = attrs.get(key, '')
                          url = urlsplit(value)
                          if value and not url.scheme and not url.netloc and url.path:
                              assert not url.path.startswith('/'), 'Use relative asset paths: ' + value
                              file = (source / unquote(url.path)).resolve()
                              assert file.is_relative_to(source / 'assets'), 'Keep page resources in assets/: ' + value
                              assert file.is_file(), 'Missing asset: ' + value
                              resources.add(file.relative_to(source))
          Resources().feed(html.decode('utf-8-sig'))
          # Restrict replacement to the preview directory; production assets remain untouched.
          if target.exists():
              shutil.rmtree(target)
          target.mkdir()
          shutil.copytree(source / 'assets', target / 'assets')
          for resource in resources:
              assert resource.suffix.lower() != '.pdf', 'Keep production PDFs managed separately'
              dest = production / resource
              dest.parent.mkdir(parents=True, exist_ok=True)
              shutil.copyfile(source / resource, dest)
          (production / 'index.html').write_bytes(html)
          (production / '.v5-root-resources.json').write_text(json.dumps([str(p) for p in sorted(resources)]))
          (target / 'index.html').write_bytes(html)
          (target / 'preview-v5.html').write_bytes(html)
          sha = subprocess.check_output(['git', '-C', str(source), 'rev-parse', 'HEAD'], text=True).strip()
          (target / 'deployment.json').write_text(json.dumps({'sourceBranch': 'portfolio-v5-preview', 'sourceCommit': sha}) + '\n')
      - name: Commit preview and promoted main page
        working-directory: production
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python - <<'PY'
          import json, subprocess
          resources = json.load(open('.v5-root-resources.json'))
          allowed = ['index.html', '.v5-root-resources.json', *resources]
          subprocess.run(['git', 'add', '--', 'v5/', *allowed], check=True)
          changed = subprocess.check_output(['git', 'diff', '--cached', '--name-only', '-z']).decode().split('\0')
          assert all(not p or p.startswith('v5/') or p in allowed for p in changed)
          PY
          if ! git diff --cached --quiet; then
            git commit -m "Deploy v5 from $(git -C ../source rev-parse --short HEAD)"
            git push origin HEAD:main
          fi
      - name: Explicitly trigger GitHub Pages build
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds"
      - name: Verify published source and images
        shell: python
        run: |
          import hashlib, json, pathlib, time, urllib.request
          from html.parser import HTMLParser
          from urllib.parse import urljoin
          base = 'https://jkrakisis.github.io/portfolio/v5/'
          target = pathlib.Path('production/v5')
          expected = json.loads((target / 'deployment.json').read_text())
          for attempt in range(40):
              try:
                  url = base + 'deployment.json?source=' + expected['sourceCommit']
                  with urllib.request.urlopen(url, timeout=15) as r:
                      actual = json.load(r)
                  if actual == expected:
                      break
              except Exception:
                  pass
              time.sleep(10)
          else:
              raise RuntimeError('Timed out waiting for the new Pages deployment')
          with urllib.request.urlopen(base, timeout=30) as r:
              html = r.read()
          assert html == (target / 'index.html').read_bytes(), 'Published HTML mismatch'
          class Images(HTMLParser):
              def handle_starttag(self, tag, attrs):
                  if tag == 'img':
                      src = dict(attrs).get('src')
                      if src:
                          with urllib.request.urlopen(urljoin(base, src), timeout=30) as r:
                              assert r.status == 200
          Images().feed(html.decode('utf-8-sig'))
          with urllib.request.urlopen('https://jkrakisis.github.io/portfolio/', timeout=30) as r:
              assert r.read() == html, 'Root page mismatch'
          print('Verified root and preview: ' + base)


